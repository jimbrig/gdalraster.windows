# =============================================================================
# e2e.yml — End-to-end verification of the full user workflow on a clean
#           Windows machine (#20).
#
# Proves the documented workflow exactly as a user machine would run it:
#   1. install the package (local checkout)
#   2. install_gdal_runtime()      — published GDAL runtime bundle
#   3. install_gdalraster()        — source build against the bundle
#   4. verify_gdalraster_runtime() — Algorithm API registry is populated
#   5. add_gdal_rprofile_hook()    — startup hook, verified in a fresh
#                                    R session via plain library(gdalraster)
#
# This workflow only consumes exported package functionality — build, link,
# and activation logic are never reimplemented in CI (see AGENTS.md
# responsibility split). gdalraster's own R dependencies are installed as
# CRAN binaries so the only from-source compile is gdalraster itself.
#
# Triggers:
#   - workflow_dispatch : manually, optionally pinning a runtime release tag
#   - schedule          : weekly (Mondays 08:00 UTC, after the upstream check)
#   - release published : gdal-v* bundle releases, so every new bundle is
#                         proven against gdalraster automatically
# =============================================================================

name: E2E Runtime Verification

on:
  workflow_dispatch:
    inputs:
      runtime_tag:
        description: 'GDAL runtime release tag to install (or "latest")'
        required: false
        default: 'latest'
  schedule:
    - cron: '0 8 * * 1'
  release:
    types: [published]

permissions: read-all

jobs:
  e2e:
    name: "E2E: runtime + gdalraster + hook"
    # release trigger fires for package releases (v*) too; only bundle
    # releases are relevant here
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'gdal-v')
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      RUNTIME_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || github.event.inputs.runtime_tag || 'latest' }}
    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      # installs gdalraster.windows (local checkout) plus its dependencies
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pak, local::.

      - name: Install GDAL runtime bundle
        shell: Rscript {0}
        run: |
          tag <- Sys.getenv("RUNTIME_TAG", unset = "latest")
          if (!nzchar(tag)) tag <- "latest"
          gdalraster.windows::install_gdal_runtime(tag = tag)

      - name: Install gdalraster R dependencies (CRAN binaries)
        shell: Rscript {0}
        run: |
          src <- file.path(tempdir(), "gdalraster-src.tar.gz")
          utils::download.file(
            "https://codeload.github.com/firelab/gdalraster/tar.gz/HEAD",
            destfile = src, mode = "wb", quiet = TRUE
          )
          exdir <- file.path(tempdir(), "gdalraster-src")
          utils::untar(src, exdir = exdir)
          pkg_dir <- list.dirs(exdir, recursive = FALSE)[[1]]
          pak::local_install_deps(pkg_dir)

      - name: Build gdalraster from source against the bundle
        shell: Rscript {0}
        run: |
          gdalraster.windows::install_gdalraster()

      - name: Verify algorithm API (explicit load)
        shell: Rscript {0}
        run: |
          ok <- gdalraster.windows::verify_gdalraster_runtime()
          stopifnot(isTRUE(ok))

      - name: Verify algorithm API (startup hook, fresh session)
        shell: Rscript {0}
        run: |
          rprofile <- file.path(getwd(), "e2e-hook.Rprofile")
          gdalraster.windows::add_gdal_rprofile_hook(rprofile = rprofile)

          script <- file.path(getwd(), "e2e-hook-check.R")
          writeLines(
            c(
              "library(gdalraster)",
              "n <- length(gdalraster::gdal_global_reg_names())",
              "cat('algorithm registry entries:', n, '\n')",
              "stopifnot(n > 0L)"
            ),
            con = script
          )

          status <- withr::with_envvar(
            c(R_PROFILE_USER = rprofile),
            system2(file.path(R.home("bin"), "Rscript.exe"), args = script)
          )
          stopifnot(identical(status, 0L))

      - name: Write summary
        if: always()
        shell: pwsh
        run: |
          @"
          ## E2E runtime verification

          | Item | Value |
          |------|-------|
          | Runtime tag | ``$env:RUNTIME_TAG`` |
          | Trigger | ``${{ github.event_name }}`` |
          | Result | ${{ job.status }} |
          "@ | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
