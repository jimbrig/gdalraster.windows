name: E2E Self-Contained Verification

on:
  workflow_dispatch:
    inputs:
      runtime_tag:
        description: 'GDAL runtime release tag to install (or "latest")'
        required: false
        default: 'latest'
  schedule:
    - cron: '0 8 * * 1'
  release:
    types: [published]

permissions: read-all

jobs:
  e2e:
    name: "E2E: setup and fresh-session load"
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'gdal-v')
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      RUNTIME_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || github.event.inputs.runtime_tag || 'latest' }}

    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pak, local::.

      - name: Install gdalraster R dependencies
        shell: Rscript {0}
        run: |
          archive <- file.path(tempdir(), "gdalraster-src.tar.gz")
          utils::download.file(
            "https://codeload.github.com/firelab/gdalraster/tar.gz/HEAD",
            archive,
            mode = "wb",
            quiet = TRUE
          )
          source_dir <- file.path(tempdir(), "gdalraster-src")
          utils::untar(archive, exdir = source_dir)
          pak::local_install_deps(list.dirs(source_dir, recursive = FALSE)[[1]])

      - name: Run package setup
        shell: Rscript {0}
        run: |
          tag <- Sys.getenv("RUNTIME_TAG", unset = "latest")
          if (!nzchar(tag)) tag <- "latest"
          gdalraster.windows::gdal_setup(
            tag = tag,
            verify = TRUE
          )

      - name: Verify plain fresh-session self-containment
        shell: Rscript {0}
        env:
          GDAL_DATA: ''
          PROJ_DATA: ''
          PROJ_LIB: ''
          PYTHONPATH: ''
          GDALRASTER_WINDOWS_GDAL_HOME: ''
        run: |
          library(gdalraster)

          algorithms <- gdalraster::gdal_global_reg_names()
          stopifnot(length(algorithms) > 0L)

          formats <- gdalraster::gdal_formats()$short_name
          required <- c("Arrow", "Parquet", "HDF5", "netCDF")
          stopifnot(all(vapply(
            required,
            function(driver) any(grepl(driver, formats, ignore.case = TRUE)),
            logical(1)
          )))
          stopifnot(isTRUE(gdalraster::has_geos()))
          stopifnot(nzchar(gdalraster::srs_to_wkt("EPSG:4326")))

          cat("GDAL:", gdalraster::gdal_version()[[1]], "\n")
          cat("algorithm registry entries:", length(algorithms), "\n")

      - name: Verify embedded-Python GeoPackage validator
        shell: Rscript {0}
        env:
          PYTHONPATH: ''
        run: |
          library(gdalraster)
          gpkg <- file.path(tempdir(), "verify.gpkg")
          gdalraster::ogr_ds_create(
            format = "GPKG",
            dsn = gpkg,
            layer = "points",
            geom_type = "Point",
            fld_name = "id",
            fld_type = "OFTInteger",
            return_obj = FALSE
          )
          validator <- gdalraster::gdal_alg(cmd = "driver gpkg validate")
          validator$setArg("dataset", gpkg)
          validator$setArg("full-check", TRUE)
          stopifnot(isTRUE(validator$run()))
          validator$output()

      - name: Write summary
        if: always()
        shell: pwsh
        run: |
          @"
          ## E2E self-contained verification

          - Runtime tag: ``$env:RUNTIME_TAG``
          - Trigger: ``${{ github.event_name }}``
          - Result: ${{ job.status }}
          "@ | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
