  type: dark
  structure:
    left:  [intro, reference, articles]
    right: [search, github]
  components:
    articles:
      text: Articles
      menu:
      - text: Getting Started
        href: articles/getting-started.html
      - text: Architecture
        href: articles/architecture.html
      - text: Runtime Guide
        href: articles/runtime-guide.html
      - text: "---"
      - text: Troubleshooting
        href: articles/troubleshooting.html

reference:
  - title: Runtime Setup
    desc: Setup the necessary runtime environment for gdalraster on Windows.
    contents:
      - gdal_home
      - configure_gdal_home
      - install_gdal_runtime
      - activate_gdal_runtime
      - load_gdal_dll
  - title: gdalraster Integration
    desc: Integrate gdalraster with the GDAL runtime on Windows.
    contents:
      - install_gdalraster
      - load_gdalraster
      - verify_gdalraster_runtime
  - title: Startup Hooks
    desc: Configure R to automatically load the GDAL runtime and gdalraster package on startup.
    contents:
      - gdal_rprofile_snippet
