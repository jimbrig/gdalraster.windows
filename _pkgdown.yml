url: https://docs.jimbrig.com/gdalraster.windows/
template:
  bootstrap: 5
  bslib:
    bg: "#f9f7f3"
    fg: "#2b4a2b"
    primary: "#355e3b"
    secondary: "#6b8e6b"
    link-color: "#2e8cb8"
    code-color: "#355e3b"

home:
  title: gdalraster.windows
  description: Installs and activates a self-contained GDAL runtime & gdalraster package on Windows.

navbar:
